<!-- =========================================================
     KAASU — a personal finance dashboard, not a spreadsheet.
     Five tabs (bottom nav): Today, Transactions, Budget, Calendar,
     Savings. Spending is logged as individual transactions, grouped
     into budget "categories" (name + setpoint + Daily/Weekly/Monthly
     reset). A negative balance at a period's end is deducted from
     that category's NEXT period; a positive leftover sweeps into
     Savings — both shown transparently on the Savings tab.
     ========================================================= -->
<script>
const KaasuApp = (() => {
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DOW = ['S','M','T','W','T','F','S'];

  const pad = (n) => String(n).padStart(2, '0');
  const dateStr = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
  const monthKey = (y, m) => `${y}-${pad(m + 1)}`;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtMoney = (n) => {
    const v = Math.round((n + Number.EPSILON) * 100) / 100;
    return (v < 0 ? '-₹' : '₹') + Math.abs(v).toLocaleString('en-IN');
  };
  const fmtDay = (ds) => {
    const [y, m, d] = ds.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
  };
  const fmtDayFull = (ds) => {
    const [y, m, d] = ds.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  };
  const todayStr = () => { const t = new Date(); return dateStr(t.getFullYear(), t.getMonth(), t.getDate()); };

  // ---- data layer ----
  // One transaction per purchase (date, columnId, amount, note). Older
  // versions of Kaasu stored a single overwritable number per day per
  // column (kaasu_entries) — migrateIfNeeded() turns each of those into
  // one transaction, once, the first time this runs. Nothing is deleted.
  async function migrateIfNeeded(db) {
    const [oldEntries, txns] = await Promise.all([db.all('kaasu_entries'), db.all('kaasu_txns')]);
    if (txns.length || !oldEntries.length) return;
    const withSpend = oldEntries.filter((e) => e.input);
    await Promise.all(withSpend.map((e) => db.put('kaasu_txns', {
      id: db.uid(), date: e.date, columnId: e.columnId, amount: e.input, note: '', createdAt: e.date + 'T12:00:00',
    })));
  }

  async function loadAll(db) {
    await migrateIfNeeded(db);
    const [columns, txns, income, plans] = await Promise.all([
      db.all('kaasu_columns'), db.all('kaasu_txns'), db.all('kaasu_income'), db.all('kaasu_plans'),
    ]);
    columns.sort((a, b) => a.number - b.number);
    txns.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    return { columns, txns, income, plans };
  }

  // Columns belong to the month they were created in. A column saved before
  // this existed (no monthKey) is treated as belonging to every month, so
  // nothing already on the phone disappears.
  const columnsFor = (columns, y, m) => columns.filter((c) => !c.monthKey || c.monthKey === monthKey(y, m)).sort((a, b) => a.number - b.number);
  const incomeFor = (income, y, m) => { const row = income.find((r) => r.id === monthKey(y, m)); return row ? row.amount : 0; };
  const txnsForMonth = (txns, y, m) => { const mk = monthKey(y, m); return txns.filter((t) => t.date.slice(0, 7) === mk); };

  function txnMap(txns) {
    const m = {};
    txns.forEach((t) => { const k = t.date + '|' + t.columnId; m[k] = (m[k] || 0) + t.amount; });
    return m;
  }

  // Splits a month into a column's budget periods: one block per day (daily),
  // Sun–Sat blocks (weekly), or the whole month as one block (monthly).
  function periodsFor(freq, y, m, n) {
    if (freq === 'monthly') return [[1, n]];
    if (freq === 'weekly') {
      const blocks = [];
      let start = 1;
      while (start <= n) {
        const dow = new Date(y, m, start).getDay();
        const end = Math.min(n, start + (6 - dow));
        blocks.push([start, end]);
        start = end + 1;
      }
      return blocks;
    }
    const blocks = [];
    for (let d = 1; d <= n; d++) blocks.push([d, d]);
    return blocks;
  }

  // Walks each column over its own periods. Within a period the balance runs
  // down as spend is logged; a negative balance at period's end is deducted
  // from that column's setpoint for the NEXT period. Leftover that's still
  // positive when a period ends is swept into that closing day's Savings.
  // Also records, per column, the sweep that happened at each period's last
  // day — so the UI can show exactly why savings moved or a budget shrank.
  function computeMonth(columns, eMap, y, m) {
    const n = daysInMonth(y, m);
    const perDay = {};
    for (let d = 1; d <= n; d++) perDay[dateStr(y, m, d)] = { cols: {}, savings: 0 };
    const colTotals = {};
    const sweeps = []; // { colId, periodEndDate, kind: 'saved'|'deficit', amount, nextSetpoint }
    let totalSavings = 0;

    columns.forEach((col) => {
      colTotals[col.id] = 0;
      const freq = col.frequency || 'daily';
      let carry = 0;
      const periods = periodsFor(freq, y, m, n);
      periods.forEach(([s, e], pi) => {
        const periodSetpoint = col.setpoint - carry;
        let cumulative = 0;
        for (let d = s; d <= e; d++) {
          const date = dateStr(y, m, d);
          const input = eMap[date + '|' + col.id] || 0;
          cumulative += input;
          colTotals[col.id] += input;
          perDay[date].cols[col.id] = { effSetpoint: periodSetpoint, input, balance: periodSetpoint - cumulative, periodEnd: d === e };
        }
        const finalBalance = periodSetpoint - cumulative;
        const endDate = dateStr(y, m, e);
        if (finalBalance > 0) {
          perDay[endDate].savings += finalBalance;
          totalSavings += finalBalance;
          sweeps.push({ colId: col.id, periodEndDate: endDate, kind: 'saved', amount: finalBalance });
        } else if (finalBalance < 0 && pi < periods.length - 1) {
          sweeps.push({ colId: col.id, periodEndDate: endDate, kind: 'deficit', amount: -finalBalance, nextSetpoint: col.setpoint - (-finalBalance) });
        }
        carry = finalBalance < 0 ? -finalBalance : 0;
      });
    });

    return { perDay, colTotals, totalSavings, sweeps };
  }

  const FREQ_LABEL = { daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly' };
  const FREQ_UNIT = { daily: '/day', weekly: '/week', monthly: '/month' };

  // ---- small line icons for the tab bar (stroke, currentColor) ----
  const ICON = {
    today: '<path d="M3 10.5 10 4l7 6.5M5 9v7h10V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    txns: '<path d="M4 5h12M4 10h12M4 15h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    budget: '<rect x="3" y="6" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h14" stroke="currentColor" stroke-width="1.6"/><circle cx="14" cy="12.5" r="1.1" fill="currentColor"/>',
    calendar: '<rect x="3.5" y="4.5" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 8h13M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    savings: '<path d="M4 11c0-3 2.5-5 6-5s6 1.8 6 4.2c0 1-.4 1.7-1 2.3v2a1 1 0 0 1-1 1h-1.3a1 1 0 0 1-1-.8l-.1-.5a9 9 0 0 1-2.6 0l-.1.5a1 1 0 0 1-1 .8H7a1 1 0 0 1-1-1v-1.2C5 12.2 4 11.8 4 11Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="13" cy="9" r=".6" fill="currentColor"/>',
  };

  function mount(el, ctx) {
    const today = new Date();
    const state = { tab: 'today', y: today.getFullYear(), m: today.getMonth(), calView: 'month', selectedDate: null };
    render();

    async function render() {
      const data = await loadAll(ctx.db);
      const shell = tabShell(data);
      el.innerHTML = shell;
      wireTabBar();
      const body = $('#kaasu-body', el);
      if (state.tab === 'txns') renderTxns(body, data);
      else if (state.tab === 'budget') renderBudget(body, data);
      else if (state.tab === 'calendar') renderCalendar(body, data);
      else if (state.tab === 'savings') renderSavings(body, data);
      else renderToday(body, data);
    }

    function tabShell() {
      const TABS = [
        ['today', 'Today'], ['txns', 'Transactions'], ['budget', 'Budget'],
        ['calendar', 'Calendar'], ['savings', 'Savings'],
      ];
      return `
        <div class="kaasu-shell">
          <div id="kaasu-body"></div>
        </div>
        <nav class="tabbar" role="tablist">
          ${TABS.map(([id, label]) => `
            <button class="tabbtn ${state.tab === id ? 'active' : ''}" data-tab="${id}" aria-label="${label}">
              <svg viewBox="0 0 20 20">${ICON[id]}</svg>
              <span>${label}</span>
            </button>`).join('')}
        </nav>`;
    }

    function wireTabBar() {
      $('.tabbar', el).onclick = (e) => {
        const b = e.target.closest('[data-tab]');
        if (!b) return;
        state.tab = b.dataset.tab;
        state.selectedDate = null;
        render();
      };
    }

    function monthNav() {
      return `<div class="month-nav">
        <button class="navbtn sm" data-mprev aria-label="Previous month">‹</button>
        <span>${MONTH_NAMES[state.m]} ${state.y}</span>
        <button class="navbtn sm" data-mnext aria-label="Next month">›</button>
      </div>`;
    }
    function wireMonthNav(scope) {
      $('[data-mprev]', scope).onclick = () => { shiftMonth(-1); };
      $('[data-mnext]', scope).onclick = () => { shiftMonth(1); };
    }
    function shiftMonth(delta) {
      let m = state.m + delta, y = state.y;
      if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
      state.m = m; state.y = y; render();
    }

    // ---- insights: pick the single most useful line, in priority order ----
    function buildInsight(columns, data, y, m) {
      const n = daysInMonth(y, m);
      const dayNum = (y === today.getFullYear() && m === today.getMonth()) ? today.getDate() : n;
      for (const col of columns) {
        if ((col.frequency || 'daily') !== 'monthly') continue;
        const spent = data.colTotals[col.id] || 0;
        if (spent <= 0 || dayNum < 4) continue;
        const projected = (spent / dayNum) * n;
        if (projected > col.setpoint * 1.05) return `At this pace, ${col.name} may go over budget this month.`;
      }
      for (const col of columns) {
        const spent = data.colTotals[col.id] || 0;
        if (col.setpoint > 0 && spent / col.setpoint >= 0.8 && spent / col.setpoint < 1) {
          return `You've used ${Math.round((spent / col.setpoint) * 100)}% of your ${col.name} budget.`;
        }
      }
      const sorted = columns.map((c) => ({ c, spent: data.colTotals[c.id] || 0 })).filter((x) => x.spent > 0).sort((a, b) => b.spent - a.spent);
      if (sorted.length) return `Your biggest expense this month is ${sorted[0].c.name} at ${fmtMoney(sorted[0].spent)}.`;
      const totalSpent = Object.values(data.colTotals).reduce((a, b) => a + b, 0);
      if (totalSpent > 0) return `Average daily spending this month: ${fmtMoney(totalSpent / dayNum)}.`;
      return null;
    }

    // ================= TODAY =================
    function renderToday(body, data) {
      const { columns: allColumns, txns, income, plans } = data;
      const columns = columnsFor(allColumns, state.y, state.m);
      const eMap = txnMap(txnsForMonth(txns, state.y, state.m));
      const calc = computeMonth(columns, eMap, state.y, state.m);
      const isCurrentMonth = state.y === today.getFullYear() && state.m === today.getMonth();
      const ds = isCurrentMonth ? todayStr() : dateStr(state.y, state.m, 1);
      const dayData = calc.perDay[ds] || { cols: {}, savings: 0 };

      const totalSpent = Object.values(calc.colTotals).reduce((a, b) => a + b, 0);
      const inc = incomeFor(income, state.y, state.m);
      const remaining = inc - totalSpent;
      const todaySpent = Object.values(dayData.cols).reduce((s, c) => s + c.input, 0);
      const safeToday = columns.reduce((s, c) => s + Math.max(0, (dayData.cols[c.id] ? dayData.cols[c.id].balance : c.setpoint)), 0);

      const topCats = columns
        .map((c) => ({ c, spent: calc.colTotals[c.id] || 0 }))
        .sort((a, b) => b.spent - a.spent)
        .slice(0, 3);

      const insight = buildInsight(columns, calc, state.y, state.m);
      const plan = plans.find((p) => p.id === monthKey(state.y, state.m));

      body.innerHTML = `
        ${monthNav()}
        <div class="hero">
          ${inc > 0 ? `<div class="hero-row"><span class="hero-label">Income</span><span class="hero-val">${fmtMoney(inc)}</span></div>` : ''}
          <div class="hero-row"><span class="hero-label">Spent</span><span class="hero-val">${fmtMoney(totalSpent)}</span></div>
          ${inc > 0 ? `<div class="hero-row"><span class="hero-label">Remaining</span><span class="hero-val ${remaining < 0 ? 'neg' : ''}">${fmtMoney(remaining)}</span></div>` : ''}
          <div class="hero-row"><span class="hero-label">Saved</span><span class="hero-val accent">${fmtMoney(calc.totalSavings)}</span></div>
        </div>

        <div class="safe-today">
          <div><span class="safe-label">${isCurrentMonth ? "Today's spend" : 'Spend that day'}</span><span class="safe-val">${fmtMoney(todaySpent)}</span></div>
          <div class="safe-div"></div>
          <div><span class="safe-label">Safe to spend</span><span class="safe-val accent">${fmtMoney(safeToday)}</span></div>
        </div>

        ${insight ? `<p class="insight">${insight}</p>` : ''}

        ${columns.length ? `
        <div class="section-head"><h3>Top categories</h3><button class="link-sm" data-goto="budget">All budgets →</button></div>
        <div class="cat-list">
          ${topCats.map(({ c, spent }) => catProgressRow(c, spent, (dayData.cols[c.id] ? dayData.cols[c.id].balance : c.setpoint))).join('')}
        </div>` : `<div class="note"><p>No categories yet. Set up your budget to start tracking.</p><button class="btn ghost" data-goto="budget" style="margin-top:12px">Set up Budget</button></div>`}

        <details class="plan-fold">
          <summary>📌 ${MONTH_NAMES[state.m]} plan</summary>
          <textarea class="sticky-text plan-text" placeholder="What's the plan this month…">${plan ? esc(plan.text) : ''}</textarea>
        </details>
      `;
      wireMonthNav(body);
      body.querySelectorAll('[data-goto]').forEach((b) => { b.onclick = () => { state.tab = b.dataset.goto; render(); }; });
      const ta = $('.plan-text', body);
      if (ta) {
        let t;
        ta.oninput = () => { clearTimeout(t); t = setTimeout(() => ctx.db.put('kaasu_plans', { id: monthKey(state.y, state.m), text: ta.value }), 500); };
      }
      mountFab(body);
    }

    function catProgressRow(col, spent, balance) {
      const pct = col.setpoint > 0 ? Math.min(100, Math.round((spent / col.setpoint) * 100)) : 0;
      const over = balance < 0;
      return `<div class="cat-row">
        <div class="cat-row-top">
          <span class="cat-name">${esc(col.name)}</span>
          <span class="cat-amt ${over ? 'neg' : ''}">${fmtMoney(spent)} <span class="cat-of">/ ${fmtMoney(col.setpoint)}</span></span>
        </div>
        <div class="progress-track"><div class="progress-fill ${over ? 'over' : ''}" style="width:${pct}%"></div></div>
      </div>`;
    }

    function mountFab(scope) {
      if (!$('.fab', scope)) {
        const fab = document.createElement('button');
        fab.className = 'fab'; fab.setAttribute('aria-label', 'Add expense');
        fab.innerHTML = '+';
        scope.appendChild(fab);
        fab.onclick = () => openAddTxnSheet();
      }
    }

    // ================= TRANSACTIONS =================
    function renderTxns(body, data) {
      const { columns: allColumns, txns } = data;
      const colById = Object.fromEntries(allColumns.map((c) => [c.id, c]));
      const monthTxns = txnsForMonth(txns, state.y, state.m);

      const groups = {};
      monthTxns.forEach((t) => { (groups[t.date] = groups[t.date] || []).push(t); });
      const days = Object.keys(groups).sort((a, b) => (a < b ? 1 : -1));

      body.innerHTML = `
        ${monthNav()}
        ${days.length ? days.map((ds) => `
          <div class="txn-day-group">
            <div class="txn-day-label">${fmtDay(ds)}</div>
            ${groups[ds].map((t) => {
              const col = colById[t.columnId];
              return `<button class="txn-row" data-edit-txn="${t.id}">
                <span class="txn-cat">${esc(col ? col.name : '—')}</span>
                ${t.note ? `<span class="txn-note">${esc(t.note)}</span>` : ''}
                <span class="txn-amt">-${fmtMoney(t.amount)}</span>
              </button>`;
            }).join('')}
          </div>`).join('') : `
          <div class="note"><p>No spending recorded yet.</p><p style="margin-top:4px">Your money story starts here.</p></div>`}
      `;
      wireMonthNav(body);
      body.querySelectorAll('[data-edit-txn]').forEach((b) => {
        b.onclick = () => openEditTxnSheet(monthTxns.find((t) => t.id === b.dataset.editTxn), colById);
      });
      mountFab(body);
    }

    function openEditTxnSheet(txn, colById) {
      const col = colById[txn.columnId];
      const sheet = ctx.ui.sheet(`
        <h2>${fmtDayFull(txn.date)}</h2>
        <p>${esc(col ? col.name : '—')} — ${fmtMoney(txn.amount)}${txn.note ? ' · ' + esc(txn.note) : ''}</p>
        <button class="btn ghost" data-edit>Edit amount / note</button>
        <button class="btn ghost" data-delete>Delete transaction</button>
        <button class="btn ghost" data-cancel>Close</button>`);
      $('[data-cancel]', sheet).onclick = () => ctx.ui.closeSheet();
      $('[data-edit]', sheet).onclick = () => openAddTxnSheet(txn);
      $('[data-delete]', sheet).onclick = async () => {
        await ctx.db.del('kaasu_txns', txn.id);
        ctx.ui.closeSheet();
        render();
        ctx.ui.toast('Transaction deleted');
      };
    }

    // ---- quick add / edit expense ----
    function openAddTxnSheet(existing, presetDate) {
      const isEdit = !!existing;
      loadAll(ctx.db).then((data) => {
        const cols = columnsFor(data.columns, state.y, state.m);
        if (!cols.length) { ctx.ui.closeSheet(); ctx.ui.toast('Add a budget category first'); state.tab = 'budget'; render(); return; }
        const recentIds = [...new Set(data.txns.map((t) => t.columnId))].filter((id) => cols.some((c) => c.id === id)).slice(0, 4);
        let chosenCol = isEdit ? existing.columnId : (recentIds[0] || cols[0].id);
        const dateVal = isEdit ? existing.date : (presetDate || (state.y === today.getFullYear() && state.m === today.getMonth() ? todayStr() : dateStr(state.y, state.m, 1)));

        const sheet = ctx.ui.sheet(`
          <h2>${isEdit ? 'Edit expense' : 'Add expense'}</h2>
          <label class="field-label">Amount (₹)<input id="txn-amt-in" type="number" inputmode="decimal" value="${isEdit ? existing.amount : ''}" placeholder="0" autofocus></label>
          <label class="field-label">Category</label>
          <div class="chip-row" id="cat-chips">
            ${cols.map((c) => `<button type="button" class="chip ${c.id === chosenCol ? 'active' : ''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}
          </div>
          <label class="field-label">Date<input id="txn-date-in" type="date" value="${dateVal}"></label>
          <label class="field-label">Note (optional)<input id="txn-note-in" type="text" value="${isEdit ? esc(existing.note || '') : ''}" placeholder="e.g. lunch with friends" maxlength="60"></label>
          <button class="btn" data-save>Save</button>
          <button class="btn ghost" data-cancel>Cancel</button>`);
        $('#txn-amt-in', sheet).focus();
        sheet.querySelectorAll('[data-cat]').forEach((b) => {
          b.onclick = () => { chosenCol = b.dataset.cat; sheet.querySelectorAll('[data-cat]').forEach((x) => x.classList.toggle('active', x === b)); };
        });
        $('[data-cancel]', sheet).onclick = () => ctx.ui.closeSheet();
        $('[data-save]', sheet).onclick = async () => {
          const amount = parseFloat($('#txn-amt-in', sheet).value);
          const date = $('#txn-date-in', sheet).value;
          const note = $('#txn-note-in', sheet).value.trim();
          if (isNaN(amount) || amount <= 0) { ctx.ui.toast('Enter an amount'); return; }
          if (!date) { ctx.ui.toast('Pick a date'); return; }
          const row = { id: isEdit ? existing.id : ctx.db.uid(), date, columnId: chosenCol, amount, note, createdAt: isEdit ? existing.createdAt : new Date().toISOString() };
          await ctx.db.put('kaasu_txns', row);
          ctx.ui.closeSheet();
          render();
          if (!isEdit) ctx.ui.toast('Expense added');
        };
      });
    }

    // ================= BUDGET =================
    function renderBudget(body, data) {
      const { columns: allColumns, income } = data;
      const columns = columnsFor(allColumns, state.y, state.m);
      const prevM = state.m === 0 ? 11 : state.m - 1, prevY = state.m === 0 ? state.y - 1 : state.y;
      const prevColumns = columnsFor(allColumns, prevY, prevM);
      const inc = incomeFor(income, state.y, state.m);

      body.innerHTML = `
        ${monthNav()}
        <label class="field-label income-field">Income this month (₹)
          <input id="income-in" type="number" inputmode="decimal" value="${inc || ''}" placeholder="optional">
        </label>

        <div class="section-head"><h3>Categories</h3></div>
        ${columns.length ? `<div class="budget-list">
          ${columns.map((c, i) => `
            <div class="budget-row">
              <div class="reorder-col">
                <button class="reorder-btn" data-up="${c.id}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">▲</button>
                <button class="reorder-btn" data-down="${c.id}" ${i === columns.length - 1 ? 'disabled' : ''} aria-label="Move down">▼</button>
              </div>
              <div class="budget-row-main">
                <span class="budget-row-name">${esc(c.name)}</span>
                <span class="budget-row-amt">${fmtMoney(c.setpoint)} <span class="col-badge">${FREQ_LABEL[c.frequency || 'daily']}</span></span>
              </div>
              <button class="edit-btn" data-edit="${c.id}" aria-label="Edit ${esc(c.name)}">✎</button>
            </div>`).join('')}
        </div>` : `<div class="note"><p>No categories for ${MONTH_NAMES[state.m]} yet.</p></div>`}

        <button class="btn ghost" data-add-new>+ Add category</button>
        ${!columns.length && prevColumns.length ? `<button class="btn ghost" data-copy>Copy ${MONTH_SHORT[prevM]}'s budget</button>` : ''}
      `;
      wireMonthNav(body);

      const incomeInput = $('#income-in', body);
      let incT;
      incomeInput.oninput = () => {
        clearTimeout(incT);
        incT = setTimeout(async () => {
          const val = parseFloat(incomeInput.value);
          await ctx.db.put('kaasu_income', { id: monthKey(state.y, state.m), amount: isNaN(val) ? 0 : val });
        }, 500);
      };

      const backFromCol = () => { ctx.ui.closeSheet(); render(); };
      $('[data-add-new]', body).onclick = () => openColumnEditSheet(ctx, state.y, state.m, columns, null, backFromCol);
      body.querySelectorAll('[data-edit]').forEach((b) => {
        b.onclick = () => openColumnEditSheet(ctx, state.y, state.m, columns, columns.find((c) => c.id === b.dataset.edit), backFromCol);
      });
      body.querySelectorAll('[data-up]').forEach((b) => { b.onclick = () => reorder(columns, b.dataset.up, -1); });
      body.querySelectorAll('[data-down]').forEach((b) => { b.onclick = () => reorder(columns, b.dataset.down, 1); });
      const copyBtn = $('[data-copy]', body);
      if (copyBtn) copyBtn.onclick = () => copyPrevBudget(prevColumns, columns);
    }

    async function reorder(columns, id, dir) {
      const i = columns.findIndex((c) => c.id === id);
      const j = i + dir;
      if (j < 0 || j >= columns.length) return;
      const a = columns[i], b = columns[j];
      await Promise.all([
        ctx.db.put('kaasu_columns', { ...a, number: b.number }),
        ctx.db.put('kaasu_columns', { ...b, number: a.number }),
      ]);
      render();
    }

    async function copyPrevBudget(prevColumns, existingColumns) {
      const existingNames = new Set(existingColumns.map((c) => c.name.toLowerCase()));
      const toCopy = prevColumns.filter((c) => !existingNames.has(c.name.toLowerCase()));
      let next = existingColumns.length ? Math.max(...existingColumns.map((c) => c.number)) + 1 : 1;
      await Promise.all(toCopy.map((c) => ctx.db.put('kaasu_columns', {
        number: next++, name: c.name, setpoint: c.setpoint, frequency: c.frequency || 'daily', monthKey: monthKey(state.y, state.m),
      })));
      render();
      ctx.ui.toast(`Copied ${toCopy.length} categor${toCopy.length === 1 ? 'y' : 'ies'}`);
    }

    // ================= CALENDAR =================
    function renderCalendar(body, data) {
      if (state.selectedDate) { renderDayDetail(body, data); return; }
      if (state.calView === 'week') { renderWeekView(body, data); return; }
      if (state.calView === 'year') { renderYearView(body); return; }
      renderMonthView(body, data);
    }

    function calToolbar() {
      return `<div class="kaasu-toolbar" role="tablist">
        ${['month', 'week', 'year'].map((v) => `<button class="seg ${state.calView === v ? 'active' : ''}" data-calview="${v}">${v[0].toUpperCase()}${v.slice(1)}</button>`).join('')}
      </div>`;
    }
    function wireCalToolbar(scope) {
      $('.kaasu-toolbar', scope).onclick = (e) => { const b = e.target.closest('[data-calview]'); if (!b) return; state.calView = b.dataset.calview; render(); };
    }

    function renderMonthView(body, data) {
      const { columns: allColumns, txns, income } = data;
      const columns = columnsFor(allColumns, state.y, state.m);
      const eMap = txnMap(txnsForMonth(txns, state.y, state.m));
      const calc = computeMonth(columns, eMap, state.y, state.m);
      const totalExpenses = Object.values(calc.colTotals).reduce((a, b) => a + b, 0);
      const inc = incomeFor(income, state.y, state.m);
      const n = daysInMonth(state.y, state.m);
      const first = new Date(state.y, state.m, 1).getDay();
      const todayDs = todayStr();

      const daySpend = {};
      let maxSpend = 0;
      for (let d = 1; d <= n; d++) {
        const ds = dateStr(state.y, state.m, d);
        const s = calc.perDay[ds] ? Object.values(calc.perDay[ds].cols).reduce((a, c) => a + c.input, 0) : 0;
        daySpend[ds] = s;
        if (s > maxSpend) maxSpend = s;
      }

      let cells = '';
      for (let i = 0; i < first; i++) cells += `<span class="day empty"></span>`;
      for (let d = 1; d <= n; d++) {
        const ds = dateStr(state.y, state.m, d);
        const s = daySpend[ds];
        const ratio = maxSpend ? s / maxSpend : 0;
        const lvl = s === 0 ? 0 : ratio > .66 ? 3 : ratio > .33 ? 2 : 1;
        cells += `<button class="day spend-lvl-${lvl} ${ds === todayDs ? 'today' : ''}" data-date="${ds}">${d}</button>`;
      }

      const sorted = columns.map((c) => ({ c, spent: calc.colTotals[c.id] || 0 })).sort((a, b) => b.spent - a.spent);

      body.innerHTML = `
        ${calToolbar()}
        <div class="kaasu-cal-head">
          <button class="navbtn" data-nav="-1" aria-label="Previous month">‹</button>
          <span>${MONTH_NAMES[state.m]} ${state.y}</span>
          <button class="navbtn" data-nav="1" aria-label="Next month">›</button>
        </div>
        <div class="kaasu-grid">${DOW.map((d) => `<span class="dow">${d}</span>`).join('')}${cells}</div>
        <div class="kaasu-summary">
          <h3>${MONTH_NAMES[state.m]} overview</h3>
          ${inc > 0 ? `<div class="summary-row"><span>Income</span><span>${fmtMoney(inc)}</span></div>` : ''}
          <div class="summary-row"><span>Expenses</span><span>${fmtMoney(totalExpenses)}</span></div>
          ${inc > 0 ? `<div class="summary-row"><span>Budget remaining</span><span class="${inc - totalExpenses < 0 ? 'neg-text' : ''}">${fmtMoney(inc - totalExpenses)}</span></div>` : ''}
          <div class="summary-row total"><span>Savings</span><span>${fmtMoney(calc.totalSavings)}</span></div>
        </div>
        ${sorted.length ? `<div class="kaasu-summary">
          <h3>Category breakdown</h3>
          ${sorted.map(({ c, spent }) => `<div class="summary-row"><span>${esc(c.name)}</span><span>${fmtMoney(spent)}</span></div>`).join('')}
        </div>` : ''}
      `;
      wireCalToolbar(body);
      $('.kaasu-cal-head', body).onclick = (e) => { const b = e.target.closest('[data-nav]'); if (!b) return; shiftMonth(parseInt(b.dataset.nav, 10)); };
      $('.kaasu-grid', body).onclick = (e) => { const b = e.target.closest('[data-date]'); if (!b) return; state.selectedDate = b.dataset.date; render(); };
    }

    function renderWeekView(body, data) {
      const { columns: allColumns, txns } = data;
      const day0 = new Date(today); day0.setDate(today.getDate() - today.getDay());
      let rows = '';
      for (let i = 0; i < 7; i++) {
        const d = new Date(day0); d.setDate(day0.getDate() + i);
        const ds = dateStr(d.getFullYear(), d.getMonth(), d.getDate());
        const columns = columnsFor(allColumns, d.getFullYear(), d.getMonth());
        const eMap = txnMap(txnsForMonth(txns, d.getFullYear(), d.getMonth()));
        const calc = computeMonth(columns, eMap, d.getFullYear(), d.getMonth());
        const day = calc.perDay[ds];
        const spent = day ? Object.values(day.cols).reduce((s, c) => s + c.input, 0) : 0;
        rows += `<button class="week-row" data-date="${ds}">
          <span class="wd">${d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' })}</span>
          <span class="wd-amt">${fmtMoney(spent)}</span>
        </button>`;
      }
      body.innerHTML = `${calToolbar()}<div class="kaasu-week-list">${rows}</div>`;
      wireCalToolbar(body);
      $('.kaasu-week-list', body).onclick = (e) => { const b = e.target.closest('[data-date]'); if (!b) return; state.selectedDate = b.dataset.date; render(); };
    }

    function renderYearView(body) {
      const y = state.y;
      const cells = MONTH_NAMES.map((name, m) => `<button class="year-month" data-m="${m}">${name.slice(0, 3)}</button>`).join('');
      body.innerHTML = `${calToolbar()}
        <div class="kaasu-cal-head">
          <button class="navbtn" data-nav="-1" aria-label="Previous year">‹</button>
          <span>${y}</span>
          <button class="navbtn" data-nav="1" aria-label="Next year">›</button>
        </div>
        <div class="kaasu-year-grid">${cells}</div>`;
      wireCalToolbar(body);
      $('.kaasu-cal-head', body).onclick = (e) => { const b = e.target.closest('[data-nav]'); if (!b) return; state.y += parseInt(b.dataset.nav, 10); render(); };
      $('.kaasu-year-grid', body).onclick = (e) => { const b = e.target.closest('[data-m]'); if (!b) return; state.m = parseInt(b.dataset.m, 10); state.calView = 'month'; render(); };
    }

    function renderDayDetail(body, data) {
      const ds = state.selectedDate;
      const [y, m, d] = ds.split('-').map(Number);
      const colById = Object.fromEntries(data.columns.map((c) => [c.id, c]));
      const dayTxns = data.txns.filter((t) => t.date === ds);
      const total = dayTxns.reduce((s, t) => s + t.amount, 0);

      body.innerHTML = `
        <button class="back-link" data-back>‹ ${MONTH_NAMES[m - 1]} ${y}</button>
        <div class="day-title">${fmtDayFull(ds)}</div>
        <div class="hero" style="margin-bottom:18px"><div class="hero-row"><span class="hero-label">Spent that day</span><span class="hero-val">${fmtMoney(total)}</span></div></div>
        ${dayTxns.length ? `<div class="txn-day-group">
          ${dayTxns.map((t) => {
            const col = colById[t.columnId];
            return `<button class="txn-row" data-edit-txn="${t.id}">
              <span class="txn-cat">${esc(col ? col.name : '—')}</span>
              ${t.note ? `<span class="txn-note">${esc(t.note)}</span>` : ''}
              <span class="txn-amt">-${fmtMoney(t.amount)}</span>
            </button>`;
          }).join('')}
        </div>` : `<div class="note"><p>Nothing logged this day.</p></div>`}
        <button class="btn ghost" data-add-here>+ Add expense for this day</button>
      `;
      $('[data-back]', body).onclick = () => { state.selectedDate = null; render(); };
      body.querySelectorAll('[data-edit-txn]').forEach((b) => { b.onclick = () => openEditTxnSheet(dayTxns.find((t) => t.id === b.dataset.editTxn), colById); });
      $('[data-add-here]', body).onclick = () => openAddTxnSheet(null, ds);
    }

    // ================= SAVINGS =================
    async function renderSavings(body, data) {
      const { columns: allColumns, txns } = data;
      const columns = columnsFor(allColumns, state.y, state.m);
      const eMap = txnMap(txnsForMonth(txns, state.y, state.m));
      const calc = computeMonth(columns, eMap, state.y, state.m);

      let yearTotal = 0;
      const monthRows = [];
      for (let mi = 11; mi >= 0; mi--) {
        const mCols = columnsFor(allColumns, state.y, mi);
        if (!mCols.length) continue;
        const mEmap = txnMap(txnsForMonth(txns, state.y, mi));
        const mCalc = computeMonth(mCols, mEmap, state.y, mi);
        yearTotal += mCalc.totalSavings;
        monthRows.push({ m: mi, total: mCalc.totalSavings });
      }

      const colById = Object.fromEntries(columns.map((c) => [c.id, c]));
      const thisMonthSweeps = calc.sweeps.filter((s) => s.periodEndDate.slice(0, 7) === monthKey(state.y, state.m));

      // A daily column sweeps once a day — 31 rows for one category would be
      // noise, not clarity. Saved amounts are totalled per category instead;
      // deficits (rarer, more worth flagging) are still shown individually.
      const savedByCol = {};
      const deficits = [];
      thisMonthSweeps.forEach((s) => {
        if (s.kind === 'saved') savedByCol[s.colId] = (savedByCol[s.colId] || 0) + s.amount;
        else deficits.push(s);
      });
      const savedRows = Object.entries(savedByCol).map(([colId, amount]) => ({ name: colById[colId] ? colById[colId].name : '—', amount }));
      const recentDeficits = deficits.slice(-5).reverse();

      body.innerHTML = `
        ${monthNav()}
        <div class="hero">
          <div class="hero-row"><span class="hero-label">${MONTH_NAMES[state.m]}</span><span class="hero-val accent">${fmtMoney(calc.totalSavings)}</span></div>
          <div class="hero-row"><span class="hero-label">${state.y}</span><span class="hero-val accent">${fmtMoney(yearTotal)}</span></div>
        </div>

        ${savedRows.length || recentDeficits.length ? `
        <div class="section-head"><h3>Why it moved</h3></div>
        <div class="sweep-list">
          ${savedRows.map(({ name, amount }) => `<div class="sweep-row"><span>${esc(name)}</span><span class="sweep-line">${fmtMoney(amount)} → Savings</span></div>`).join('')}
          ${recentDeficits.map((s) => { const col = colById[s.colId]; return `<div class="sweep-row"><span>${esc(col ? col.name : '—')}</span><span class="sweep-line neg-text">−${fmtMoney(s.amount)} over → next budget ${fmtMoney(s.nextSetpoint)}</span></div>`; }).join('')}
          ${deficits.length > 5 ? `<p class="muted-note">+${deficits.length - 5} more over-budget period${deficits.length - 5 === 1 ? '' : 's'} this month</p>` : ''}
        </div>` : ''}

        ${monthRows.length ? `
        <div class="section-head"><h3>History</h3></div>
        <div class="manage-col-list">
          ${monthRows.map(({ m, total }) => `<div class="manage-col-row"><span class="manage-col-name">${MONTH_NAMES[m]}</span><span class="manage-col-set">${fmtMoney(total)}</span></div>`).join('')}
        </div>` : `<div class="note"><p>Nothing saved yet.</p><p style="margin-top:4px">Even ₹10 counts.</p></div>`}
      `;
      wireMonthNav(body);
    }
  }

  // Shared name/setpoint/frequency editor for a budget category — used from
  // the Budget tab. onBack() runs after save, delete, or cancel.
  function openColumnEditSheet(ctx, y, mZero, monthColumnsSnapshot, existing, onBack) {
    const isEdit = !!existing;
    const freq0 = isEdit ? (existing.frequency || 'daily') : 'daily';
    const sheet = ctx.ui.sheet(`
      <h2>${isEdit ? 'Edit category' : 'New category'}</h2>
      <label class="field-label">Name<input id="col-name-in" type="text" value="${isEdit ? esc(existing.name) : ''}" placeholder="e.g. Food" maxlength="24"></label>
      <div class="field-label">Resets
        <div class="freq-switch">
          <button type="button" class="seg ${freq0 === 'daily' ? 'active' : ''}" data-freq="daily">Daily</button>
          <button type="button" class="seg ${freq0 === 'weekly' ? 'active' : ''}" data-freq="weekly">Weekly</button>
          <button type="button" class="seg ${freq0 === 'monthly' ? 'active' : ''}" data-freq="monthly">Monthly</button>
        </div>
      </div>
      <label class="field-label" id="set-label">${FREQ_LABEL[freq0]} setpoint (₹)<input id="col-set-in" type="number" inputmode="decimal" value="${isEdit ? existing.setpoint : ''}" placeholder="e.g. 300"></label>
      <button class="btn" data-save>Save</button>
      ${isEdit ? `<button class="btn ghost" data-delete>Delete category</button>` : ''}
      <button class="btn ghost" data-cancel>Cancel</button>`);
    let freq = freq0;
    $('#col-name-in', sheet).focus();
    sheet.querySelectorAll('[data-freq]').forEach((b) => {
      b.onclick = () => {
        freq = b.dataset.freq;
        sheet.querySelectorAll('[data-freq]').forEach((x) => x.classList.toggle('active', x === b));
        $('#set-label', sheet).firstChild.textContent = `${FREQ_LABEL[freq]} setpoint (₹)`;
      };
    });
    $('[data-cancel]', sheet).onclick = () => onBack();
    $('[data-save]', sheet).onclick = async () => {
      const name = $('#col-name-in', sheet).value.trim();
      const setpoint = parseFloat($('#col-set-in', sheet).value);
      if (!name) { ctx.ui.toast('Give the category a name'); return; }
      if (isNaN(setpoint) || setpoint < 0) { ctx.ui.toast('Enter a valid setpoint'); return; }
      if (isEdit) await ctx.db.put('kaasu_columns', { ...existing, name, setpoint, frequency: freq });
      else {
        const number = monthColumnsSnapshot.length ? Math.max(...monthColumnsSnapshot.map((c) => c.number)) + 1 : 1;
        await ctx.db.put('kaasu_columns', { number, name, setpoint, frequency: freq, monthKey: monthKey(y, mZero) });
      }
      onBack();
    };
    if (isEdit) {
      $('[data-delete]', sheet).onclick = async () => {
        const ok = await ctx.ui.confirm('Delete this category?', `“${esc(existing.name)}” and every logged expense in it will be removed. This can\u2019t be undone.`, 'Delete');
        if (!ok) return;
        await ctx.db.del('kaasu_columns', existing.id);
        const allTxns = await ctx.db.all('kaasu_txns');
        await Promise.all(allTxns.filter((t) => t.columnId === existing.id).map((t) => ctx.db.del('kaasu_txns', t.id)));
        onBack();
      };
    }
  }

  return { mount };
})();
</script>


<!-- =========================================================
     HEALTH MUKIYAM BIGIL UH
     Fully custom habit tracker — nothing pre-filled. A habit is
     either Daily or Weekly (N times a week, e.g. hair oil once a
     week), logged by date.
     ========================================================= -->
<script>
const HealthApp = (() => {
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW = ['S','M','T','W','T','F','S'];

  const pad = (n) => String(n).padStart(2, '0');
  const dateStr = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sameDate = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

  async function loadAll(db) {
    const [habits, logs] = await Promise.all([db.all('health_habits'), db.all('health_logs')]);
    habits.sort((a, b) => (a.order || 0) - (b.order || 0));
    return { habits, logs };
  }

  function logSet(logs) {
    const s = new Set();
    logs.forEach((l) => s.add(l.date + '|' + l.habitId));
    return s;
  }

  function weekStart(d) { const s = new Date(d); s.setDate(d.getDate() - d.getDay()); return s; }

  function mount(el, ctx) {
    const today = new Date();
    const state = { view: 'daily', y: today.getFullYear(), m: today.getMonth(), d: today.getDate() };
    render();

    const cursor = () => new Date(state.y, state.m, state.d);
    const setCursor = (dt) => { state.y = dt.getFullYear(); state.m = dt.getMonth(); state.d = dt.getDate(); };

    async function render() {
      const { habits, logs } = await loadAll(ctx.db);
      const done = logSet(logs);
      if (state.view === 'weekly') renderWeekly(habits, done);
      else if (state.view === 'monthly') renderMonthly(habits, done);
      else renderDaily(habits, done);
    }

    const toolbar = () => `<div class="kaasu-toolbar" role="tablist">
      ${['daily', 'weekly', 'monthly'].map((v) => `<button class="seg ${state.view === v ? 'active' : ''}" data-view="${v}">${v[0].toUpperCase()}${v.slice(1)}</button>`).join('')}
    </div>`;

    function wireToolbar() {
      $('.kaasu-toolbar', el).onclick = (e) => { const b = e.target.closest('[data-view]'); if (!b) return; state.view = b.dataset.view; render(); };
    }

    async function toggle(dateStrVal, habitId, isDone) {
      const id = dateStrVal + '|' + habitId;
      if (isDone) await ctx.db.del('health_logs', id);
      else await ctx.db.put('health_logs', { id, date: dateStrVal, habitId });
      render();
    }

    function renderDaily(habits, done) {
      const dt = cursor();
      const ds = dateStr(state.y, state.m, state.d);
      const label = dt.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

      const rows = habits.map((h) => {
        const isDone = done.has(ds + '|' + h.id);
        return `<div class="habit-row">
          <button class="habit-check ${isDone ? 'checked' : ''}" data-toggle="${h.id}" aria-label="${isDone ? 'Mark not done' : 'Mark done'}: ${esc(h.name)}">${isDone ? '✓' : ''}</button>
          <div class="habit-main">
            <span class="habit-name">${esc(h.name)}</span>
            <span class="habit-badge">${h.kind === 'weekly' ? (h.timesPerWeek || 1) + 'x / week' : 'Daily'}</span>
          </div>
          <button class="edit-btn" data-edit="${h.id}" aria-label="Edit ${esc(h.name)}">✎</button>
        </div>`;
      }).join('');

      el.innerHTML = `
        ${toolbar()}
        <div class="kaasu-cal-head">
          <button class="navbtn" data-nav="-1" aria-label="Previous day">‹</button>
          <span>${label}</span>
          <button class="navbtn" data-nav="1" aria-label="Next day">›</button>
        </div>
        ${habits.length ? `<div class="habit-list">${rows}</div>` : `<div class="note"><p>No habits yet. Add your own below — nothing is pre-filled.</p></div>`}
        <button class="btn ghost add-col-btn" data-add>+ Add habit</button>`;

      wireToolbar();
      $('.kaasu-cal-head', el).onclick = (e) => { const b = e.target.closest('[data-nav]'); if (!b) return; const nd = new Date(dt); nd.setDate(dt.getDate() + parseInt(b.dataset.nav, 10)); setCursor(nd); render(); };
      $('[data-add]', el).onclick = () => openHabitSheet();
      el.querySelectorAll('[data-edit]').forEach((b) => { b.onclick = () => openHabitSheet(habits.find((h) => h.id === b.dataset.edit)); });
      el.querySelectorAll('[data-toggle]').forEach((b) => { b.onclick = () => toggle(ds, b.dataset.toggle, b.classList.contains('checked')); });

      function openHabitSheet(existing) { openHabitSheetShared(existing, habits, render, ctx); }
    }

    function renderWeekly(habits, done) {
      const dt = cursor();
      const start = weekStart(dt);
      const days = [...Array(7)].map((_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
      const endLabel = days[6].toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
      const startLabel = days[0].toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });

      const rows = habits.map((h) => {
        const weekCount = days.filter((d) => done.has(dateStr(d.getFullYear(), d.getMonth(), d.getDate()) + '|' + h.id)).length;
        const dayDots = days.map((d) => {
          const ds = dateStr(d.getFullYear(), d.getMonth(), d.getDate());
          const isDone = done.has(ds + '|' + h.id);
          return `<button class="dow-check ${isDone ? 'checked' : ''}" data-toggle="${h.id}" data-date="${ds}">${isDone ? '✓' : ''}</button>`;
        }).join('');
        return `<div class="week-habit-row">
          <div class="habit-main">
            <span class="habit-name">${esc(h.name)}</span>
            <span class="habit-badge">${h.kind === 'weekly' ? weekCount + '/' + (h.timesPerWeek || 1) + ' this week' : weekCount + '/7 this week'}</span>
          </div>
          <div class="dow-grid">${dayDots}</div>
        </div>`;
      }).join('');

      el.innerHTML = `
        ${toolbar()}
        <div class="kaasu-cal-head">
          <button class="navbtn" data-nav="-1" aria-label="Previous week">‹</button>
          <span>${startLabel} – ${endLabel}</span>
          <button class="navbtn" data-nav="1" aria-label="Next week">›</button>
        </div>
        <div class="dow-labels">${DOW.map((d) => `<span>${d}</span>`).join('')}</div>
        ${habits.length ? `<div class="week-habit-list">${rows}</div>` : `<div class="note"><p>No habits yet. Add your own from the Daily tab.</p></div>`}`;

      wireToolbar();
      $('.kaasu-cal-head', el).onclick = (e) => { const b = e.target.closest('[data-nav]'); if (!b) return; const nd = new Date(dt); nd.setDate(dt.getDate() + parseInt(b.dataset.nav, 10) * 7); setCursor(nd); render(); };
      el.querySelectorAll('[data-toggle]').forEach((b) => { b.onclick = () => toggle(b.dataset.date, b.dataset.toggle, b.classList.contains('checked')); });
    }

    function renderMonthly(habits, done) {
      const { y, m } = state;
      const first = new Date(y, m, 1).getDay();
      const n = daysInMonth(y, m);
      const total = habits.length;

      let cells = '';
      for (let i = 0; i < first; i++) cells += `<span class="day empty"></span>`;
      for (let d = 1; d <= n; d++) {
        const ds = dateStr(y, m, d);
        const count = total ? habits.filter((h) => done.has(ds + '|' + h.id)).length : 0;
        const lvl = !total ? '' : count === 0 ? 'lvl-0' : count === total ? 'lvl-2' : 'lvl-1';
        cells += `<button class="day health-day ${lvl}" data-date="${ds}">
          <span class="dnum">${d}</span>${total ? `<span class="dfrac">${count}/${total}</span>` : ''}
        </button>`;
      }

      el.innerHTML = `
        ${toolbar()}
        <div class="kaasu-cal-head">
          <button class="navbtn" data-nav="-1" aria-label="Previous month">‹</button>
          <span>${MONTH_NAMES[m]} ${y}</span>
          <button class="navbtn" data-nav="1" aria-label="Next month">›</button>
        </div>
        <div class="kaasu-grid health-grid">${DOW.map((d) => `<span class="dow">${d}</span>`).join('')}${cells}</div>
        ${!total ? `<div class="note"><p>Add a habit from the Daily tab to see it here.</p></div>` : ''}`;

      wireToolbar();
      $('.kaasu-cal-head', el).onclick = (e) => { const b = e.target.closest('[data-nav]'); if (!b) return; let nm = state.m + parseInt(b.dataset.nav, 10), ny = state.y; if (nm < 0) { nm = 11; ny--; } if (nm > 11) { nm = 0; ny++; } state.m = nm; state.y = ny; render(); };
      $('.health-grid', el).onclick = (e) => { const b = e.target.closest('[data-date]'); if (!b) return; const [yy, mm, dd] = b.dataset.date.split('-').map(Number); state.y = yy; state.m = mm - 1; state.d = dd; state.view = 'daily'; render(); };
    }

    function openHabitSheetShared(existing, habits, afterSave) {
      const isEdit = !!existing;
      const kind0 = isEdit ? existing.kind : 'daily';
      const sheet = ctx.ui.sheet(`
        <h2>${isEdit ? 'Edit habit' : 'New habit'}</h2>
        <label class="field-label">Name<input id="h-name-in" type="text" value="${isEdit ? esc(existing.name) : ''}" placeholder="e.g. Hair oil" maxlength="28"></label>
        <div class="kind-switch">
          <button type="button" class="seg ${kind0 === 'daily' ? 'active' : ''}" data-kind="daily">Daily</button>
          <button type="button" class="seg ${kind0 === 'weekly' ? 'active' : ''}" data-kind="weekly">Weekly</button>
        </div>
        <label class="field-label" id="times-wrap" style="${kind0 === 'weekly' ? '' : 'display:none'}">Times per week<input id="h-times-in" type="number" inputmode="numeric" min="1" max="7" value="${isEdit && existing.timesPerWeek ? existing.timesPerWeek : 1}"></label>
        <button class="btn" data-save>Save</button>
        ${isEdit ? `<button class="btn ghost" data-delete>Delete habit</button>` : ''}
        <button class="btn ghost" data-cancel>Cancel</button>`);
      let kind = kind0;
      $('#h-name-in', sheet).focus();
      sheet.querySelectorAll('[data-kind]').forEach((b) => {
        b.onclick = () => { kind = b.dataset.kind; sheet.querySelectorAll('[data-kind]').forEach((x) => x.classList.toggle('active', x === b)); $('#times-wrap', sheet).style.display = kind === 'weekly' ? '' : 'none'; };
      });
      $('[data-cancel]', sheet).onclick = () => ctx.ui.closeSheet();
      $('[data-save]', sheet).onclick = async () => {
        const name = $('#h-name-in', sheet).value.trim();
        if (!name) { ctx.ui.toast('Give the habit a name'); return; }
        const timesPerWeek = kind === 'weekly' ? Math.max(1, Math.min(7, parseInt($('#h-times-in', sheet).value, 10) || 1)) : undefined;
        if (isEdit) await ctx.db.put('health_habits', { ...existing, name, kind, timesPerWeek });
        else {
          const order = habits.length ? Math.max(...habits.map((h) => h.order || 0)) + 1 : 1;
          await ctx.db.put('health_habits', { name, kind, timesPerWeek, order });
        }
        ctx.ui.closeSheet();
        afterSave();
      };
      if (isEdit) {
        $('[data-delete]', sheet).onclick = async () => {
          const ok = await ctx.ui.confirm('Delete this habit?', `“${esc(existing.name)}” and all its logged days will be removed. This can\u2019t be undone.`, 'Delete');
          if (!ok) return;
          await ctx.db.del('health_habits', existing.id);
          const allLogs = await ctx.db.all('health_logs');
          await Promise.all(allLogs.filter((l) => l.habitId === existing.id).map((l) => ctx.db.del('health_logs', l.id)));
          afterSave();
        };
      }
    }
  }

  return { mount };
})();
</script>

<script>
(async () => {
  SCENE.apply();   // paint today's background immediately, before anything async
  try {
    await DB.init();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();  // ask iOS not to evict our data
  } catch (err) {
    console.error('Database failed to open', err);
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const prevPlace = SCENE.current && SCENE.current.place.name;
    SCENE.apply();
    updateGreeting();
    const q = $('.quote');
    if (q && SCENE.current) q.textContent = SCENE.current.quote;
    if (!q && SCENE.current && SCENE.current.place.name !== prevPlace) { /* mid-app, background already swapped silently */ }
  });
  setInterval(updateGreeting, 60000);
  route();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
