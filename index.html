<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1B140C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ANU">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ANU</title>

<style>
/* =========================================================
   ANU design system — classic & glass
   A new scenic photo-poster sits behind everything, changing
   daily. Every surface above it is frosted glass so the scene
   always shows through. Variable NAMES are kept from the first
   version so every rule below still lines up; only the values
   moved from pink to an ink-and-antique-gold palette.
   ========================================================= */
:root {
  --cream: rgba(250, 246, 236, .86);   /* sheet / dialog glass */
  --blush: rgba(255, 255, 255, .16);   /* faint glass wash */
  --pale: rgba(255, 255, 255, .34);    /* standard glass surface */
  --rose: #C9A227;                     /* gold — borders, focus, outline */
  --rose-deep: #8C6A1F;                /* deep bronze-gold — accents, fills */
  --ink: #2B2318;                      /* warm charcoal text */
  --muted: #7C715E;                    /* warm taupe secondary text */
  --line: rgba(43, 35, 20, .16);
  --shadow: 0 10px 30px -12px rgba(20, 15, 5, .35), 0 2px 8px rgba(20, 15, 5, .12);
  --blur: blur(20px) saturate(160%);
  --serif: ui-serif, "Iowan Old Style", "New York", Georgia, "Times New Roman", serif;
  --round: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: #1b140c; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--round);
  color: var(--ink);
  background: transparent;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; border-radius: 12px; }

/* ---------- Daily scenic background ---------- */
.bg { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: #1b140c; }
.bg svg { width: 100%; height: 100%; display: block; }
.bg-scrim {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, rgba(10, 7, 3, .40) 0%, rgba(10, 7, 3, .06) 26%, rgba(10, 7, 3, .10) 70%, rgba(10, 7, 3, .55) 100%);
}
.bg-caption {
  position: fixed; left: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 0;
  color: rgba(255, 255, 255, .88); font: 500 12.5px/1.3 var(--round);
  text-shadow: 0 1px 6px rgba(0, 0, 0, .55); pointer-events: none;
}
.bg-caption b { font-weight: 600; }

/* ---------- Screens ---------- */
.screen { animation: enter .24s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Home ---------- */
.home {
  max-width: 520px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 48px) 22px calc(env(safe-area-inset-bottom, 0px) + 24px);
}
.greeting {
  margin: 0 0 10px; color: #fff; text-shadow: 0 2px 14px rgba(0, 0, 0, .40);
  font: 500 clamp(34px, 10.5vw, 46px)/1.08 var(--serif);
  letter-spacing: -.012em;
  text-wrap: balance;
}
.greeting .em { font-size: .78em; margin-left: .12em; }
.quote {
  margin: 0 0 30px; color: rgba(255, 255, 255, .92); text-shadow: 0 1px 10px rgba(0, 0, 0, .40);
  font: italic 400 15.5px/1.5 var(--serif); max-width: 34ch; text-wrap: balance;
}

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card {
  display: flex; flex-direction: column; justify-content: space-between; gap: 22px;
  min-height: 164px; padding: 18px;
  border-radius: 26px;
  background: var(--pale);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid rgba(255, 255, 255, .55);
  box-shadow: var(--shadow);
  color: var(--ink); text-decoration: none;
  transition: transform .16s ease, box-shadow .16s ease;
}
.card:active { transform: scale(.97); }
.card .ico {
  width: 54px; height: 54px; display: grid; place-items: center;
  border-radius: var(--ico-radius, 18px);
  background: rgba(255, 255, 255, .55);
  font-size: 28px; line-height: 1;
}
.card .name { font: 600 17px/1.22 var(--round); text-wrap: balance; }

.foot { margin-top: 34px; text-align: center; }
.linkbtn {
  min-height: 44px; padding: 10px 18px; border: 1px solid rgba(255, 255, 255, .4);
  background: var(--blush); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  font: 500 14px/1 var(--round); color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, .3);
  cursor: pointer; border-radius: 999px;
}

/* ---------- Mini-app screen shell ---------- */
.app {
  max-width: 520px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 20px calc(env(safe-area-inset-bottom, 0px) + 28px);
  min-height: 100vh; min-height: 100dvh;
}
.bar { display: flex; align-items: center; gap: 12px; min-height: 56px; margin-bottom: 14px; }
.back {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center;
  border-radius: 50%; background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid rgba(255, 255, 255, .5);
  box-shadow: var(--shadow); color: var(--rose-deep); text-decoration: none;
}
.bar h1 { margin: 0; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, .40); font: 500 27px/1.1 var(--serif); letter-spacing: -.01em; }
.note {
  margin-top: 40px; padding: 26px 22px; text-align: center;
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid rgba(255, 255, 255, .5);
  border-radius: 26px; box-shadow: var(--shadow);
}
.note .big { font-size: 40px; }
.note p { margin: 10px 0 0; color: var(--muted); font-size: 16px; line-height: 1.45; }

/* ---------- Buttons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; width: 100%;
  min-height: 52px; padding: 14px 18px; border: 0; border-radius: 18px;
  font: 600 17px/1 var(--round); cursor: pointer;
  background: var(--rose-deep); color: #fff;
}
.btn.ghost {
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  color: var(--rose-deep); border: 1px solid var(--line);
}
.btn:active { transform: scale(.98); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }

/* ---------- Bottom sheet + toast ---------- */
dialog#sheet {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; padding: 0; border: 0;
  width: min(520px, 100%); max-width: 100%;
  border-radius: 28px 28px 0 0; background: var(--cream); color: var(--ink);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-top: 1px solid rgba(255, 255, 255, .6);
  box-shadow: 0 -12px 40px rgba(20, 15, 5, .28);
}
dialog#sheet::backdrop { background: rgba(10, 7, 3, .40); }
dialog#sheet[open] { animation: rise .22s ease both; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-in { padding: 26px 22px calc(env(safe-area-inset-bottom, 0px) + 22px); display: grid; gap: 12px; }
.sheet-in h2 { margin: 0; font: 500 24px/1.15 var(--serif); }
.sheet-in p { margin: 0 0 6px; color: var(--muted); font-size: 15px; line-height: 1.5; }

#toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  padding: 12px 18px; border-radius: 999px; background: rgba(27, 20, 12, .88); color: #fff;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  font: 500 15px/1.2 var(--round); max-width: calc(100% - 40px); text-align: center;
  transition: opacity .2s ease, transform .2s ease; z-index: 50;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .screen, dialog#sheet[open] { animation: none; }
  .card, .btn { transition: none; }
}

/* ---------- Kaasu ---------- */
.kaasu-toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
.seg {
  flex: 1; min-height: 40px; border: 1px solid rgba(255, 255, 255, .45);
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-radius: 14px; font: 600 14px/1 var(--round); color: var(--muted);
}
.seg.active { background: var(--rose-deep); color: #fff; border-color: var(--rose-deep); }

.kaasu-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, .35); font: 600 17px/1 var(--round); }
.navbtn {
  width: 40px; height: 40px; border: 1px solid rgba(255, 255, 255, .5);
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-radius: 50%; font-size: 19px; color: var(--rose-deep); box-shadow: var(--shadow);
}

.kaasu-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
.dow { text-align: center; font: 600 12px/1 var(--round); color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, .35); padding: 2px 0 8px; }
.day {
  aspect-ratio: 1; border: 1px solid rgba(255, 255, 255, .45); border-radius: 13px;
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  font: 600 15px/1 var(--round); color: var(--ink); box-shadow: 0 2px 8px rgba(20, 15, 5, .10);
}
.day.today { background: var(--rose-deep); color: #fff; border-color: var(--rose-deep); }
.day.empty { background: transparent; box-shadow: none; border: 0; }

.kaasu-summary {
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid rgba(255, 255, 255, .5);
  border-radius: 22px; padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.kaasu-summary h3 { margin: 0 0 8px; font: 500 18px/1.2 var(--serif); }
.summary-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; font-size: 15px; border-top: 1px solid var(--line); }
.summary-row:first-of-type { border-top: 0; }
.summary-row.total { margin-top: 2px; padding-top: 13px; border-top: 1px solid var(--line); font-weight: 700; color: var(--rose-deep); }

.kaasu-sticky {
  position: relative; background: rgba(255, 246, 219, .80); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, .5);
  border-radius: 4px; padding: 20px 16px 16px; box-shadow: 0 6px 18px rgba(20, 15, 5, .16); transform: rotate(-1deg);
}
.kaasu-sticky .pin { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); font-size: 20px; }
.sticky-text { width: 100%; min-height: 86px; border: 0; background: transparent; resize: vertical; font: 15px/1.5 var(--round); color: #6B4E17; }
.sticky-text:focus { outline: none; }
.sticky-text::placeholder { color: #A98A3C; }

.kaasu-week-list { display: grid; gap: 10px; }
.week-row {
  display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 52px; padding: 0 18px;
  border: 1px solid rgba(255, 255, 255, .45); border-radius: 16px;
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: 0 2px 8px rgba(20, 15, 5, .10); font: 500 15px/1 var(--round); color: var(--ink);
}
.wd-amt { color: var(--muted); }

.kaasu-year-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.year-month {
  min-height: 64px; border: 1px solid rgba(255, 255, 255, .45); border-radius: 16px;
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: 0 2px 8px rgba(20, 15, 5, .10); font: 600 16px/1 var(--round); color: var(--ink);
}

.back-link { border: 0; background: transparent; color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, .35); font: 600 15px/1 var(--round); padding: 6px 0; margin: 0 0 8px; }
.day-title { color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, .40); font: 500 21px/1.2 var(--serif); margin-bottom: 16px; text-wrap: balance; }

.col-list { display: grid; gap: 10px; margin-bottom: 14px; }
.col-row {
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid rgba(255, 255, 255, .5);
  border-radius: 18px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(20, 15, 5, .10);
}
.col-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.col-num { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 50%; background: rgba(255, 255, 255, .55); color: var(--rose-deep); font: 700 12px/1 var(--round); }
.col-name { flex: 1; font: 600 16px/1.2 var(--round); }
.col-badge { flex: none; font: 600 10.5px/1 var(--round); color: var(--rose-deep); background: rgba(255, 255, 255, .55); border-radius: 999px; padding: 4px 8px; }
.edit-btn { width: 32px; height: 32px; flex: none; border: 0; background: rgba(255, 255, 255, .55); border-radius: 10px; color: var(--rose-deep); font-size: 14px; }
.col-fields { display: flex; align-items: center; gap: 12px; }
.col-input-wrap { flex: 1; display: flex; align-items: center; gap: 3px; background: rgba(255, 255, 255, .45); border-radius: 12px; padding: 0 12px; min-height: 44px; }
.col-input-wrap .unit { color: var(--muted); font-size: 15px; }
.col-input { flex: 1; width: 100%; min-width: 0; border: 0; background: transparent; min-height: 44px; font: 600 16px/1 var(--round); color: var(--ink); }
.col-input:focus { outline: none; }
.col-balance { min-width: 84px; text-align: right; font: 700 16px/1 var(--round); color: var(--rose-deep); }
.col-balance.neg { color: #B23B3B; }

.savings-row {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid rgba(255, 255, 255, .5);
  border-radius: 16px; padding: 14px 18px; font: 600 16px/1 var(--round); box-shadow: var(--shadow); margin-bottom: 18px;
}
.savings-row .neg { color: #B23B3B; }

.manage-cols-btn { margin-bottom: 16px; }
.manage-col-list { display: grid; gap: 8px; margin: 4px 0 4px; }
.manage-col-row { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, .40); border-radius: 14px; padding: 10px 12px; }
.manage-col-name { flex: 1; font: 600 15px/1.2 var(--round); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.freq-switch { display: flex; gap: 8px; margin-top: 6px; }
.freq-switch .seg { min-height: 42px; }
.manage-col-set { color: var(--muted); font: 500 13.5px/1 var(--round); }
.muted-note { color: var(--muted); font-size: 14px; margin: 4px 0; }
.neg-text { color: #B23B3B; }

/* ---------- Kaasu: tab shell ---------- */
.kaasu-shell { padding-bottom: 84px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: space-around;
  padding: 8px 6px calc(env(safe-area-inset-bottom, 0px) + 6px);
  background: var(--cream); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-top: 1px solid rgba(255, 255, 255, .5); box-shadow: 0 -8px 24px rgba(20, 15, 5, .14);
}
.tabbtn { flex: 1; max-width: 84px; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: transparent; padding: 4px 2px; color: var(--muted); }
.tabbtn svg { width: 21px; height: 21px; }
.tabbtn span { font: 500 10.5px/1 var(--round); }
.tabbtn.active { color: var(--rose-deep); }

.month-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 16px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.35); font: 600 16px/1 var(--round); }
.navbtn.sm { width: 32px; height: 32px; font-size: 15px; }

/* ---------- Kaasu: Today ---------- */
.hero {
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid rgba(255,255,255,.5); border-radius: 22px; padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.hero-row { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
.hero-row:first-child { border-top: 0; }
.hero-label { font: 500 14px/1 var(--round); color: var(--muted); }
.hero-val { font: 700 20px/1 var(--round); color: var(--ink); }
.hero-val.accent { color: var(--rose-deep); }
.hero-val.neg { color: #B23B3B; }

.safe-today {
  display: flex; align-items: center; background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid rgba(255,255,255,.5); border-radius: 18px; padding: 14px 18px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.safe-today > div:not(.safe-div) { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.safe-div { flex: none; width: 1px; align-self: stretch; background: var(--line); margin: 0 14px; }
.safe-label { font: 500 12.5px/1.2 var(--round); color: var(--muted); }
.safe-val { font: 700 18px/1.2 var(--round); color: var(--ink); }
.safe-val.accent { color: var(--rose-deep); }

.insight { margin: 0 0 16px; padding: 12px 16px; background: rgba(201,162,39,.14); border-left: 3px solid var(--rose); border-radius: 0 12px 12px 0; font: italic 400 14px/1.5 var(--serif); color: var(--ink); }

.section-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
.section-head h3 { margin: 0; font: 500 16px/1.2 var(--serif); color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
.link-sm { border: 0; background: transparent; color: var(--rose); font: 600 12.5px/1 var(--round); text-shadow: 0 1px 6px rgba(0,0,0,.3); }

.cat-list { display: grid; gap: 10px; margin-bottom: 16px; }
.cat-row { background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid rgba(255,255,255,.5); border-radius: 16px; padding: 12px 14px; }
.cat-row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.cat-name { font: 600 15px/1.2 var(--round); }
.cat-amt { font: 600 13.5px/1 var(--round); color: var(--muted); }
.cat-amt.neg { color: #B23B3B; }
.cat-of { font-weight: 400; opacity: .8; }
.progress-track { height: 6px; border-radius: 999px; background: rgba(43,35,20,.1); overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; background: var(--rose-deep); }
.progress-fill.over { background: #B23B3B; }

.plan-fold { background: rgba(255,246,219,.80); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.5); border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; }
.plan-fold summary { font: 600 14px/1 var(--round); color: #6B4E17; cursor: pointer; }
.plan-fold .plan-text { width: 100%; min-height: 70px; border: 0; background: transparent; resize: vertical; font: 14.5px/1.5 var(--round); color: #6B4E17; margin-top: 10px; }
.plan-fold .plan-text:focus { outline: none; }

.fab {
  position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); z-index: 9;
  width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--rose-deep); color: #fff;
  font: 300 30px/1 var(--round); box-shadow: 0 10px 24px rgba(20,15,5,.35); display: grid; place-items: center;
}

/* ---------- Kaasu: Transactions ---------- */
.txn-day-group { margin-bottom: 16px; }
.txn-day-label { font: 600 12.5px/1 var(--round); color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.3); margin-bottom: 8px; }
.txn-row {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 14px; margin-bottom: 8px;
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid rgba(255,255,255,.5); border-radius: 14px; text-align: left;
}
.txn-cat { font: 600 14.5px/1 var(--round); color: var(--ink); }
.txn-note { flex: 1; font: 400 13px/1 var(--round); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.txn-amt { margin-left: auto; font: 700 15px/1 var(--round); color: #B23B3B; flex: none; }

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
.chip { border: 1px solid var(--line); background: rgba(255,255,255,.5); border-radius: 999px; padding: 8px 14px; font: 500 13.5px/1 var(--round); color: var(--muted); }
.chip.active { background: var(--rose-deep); border-color: var(--rose-deep); color: #fff; }

/* ---------- Kaasu: Budget ---------- */
.income-field { margin-bottom: 18px; }
.budget-list { display: grid; gap: 10px; margin-bottom: 14px; }
.budget-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--pale); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid rgba(255,255,255,.5); border-radius: 16px; padding: 10px 12px;
}
.reorder-col { display: flex; flex-direction: column; gap: 2px; }

<body>

<!-- Daily scenic background — swapped in by SCENE.apply() before anything else renders -->

<div class="bg-scrim" aria-hidden="true"></div>

<!-- =========================================================
     CORE  (shared by every mini-app; don't put mini-app code here)
     ========================================================= -->
<script>
'use strict';

const OWNER = 'Anu';
const APPS = [];                       // filled by registerApp()
const $ = (sel, el = document) => el.querySelector(sel);

/* =========================================================
   SCENE — the daily background.
   30 hand-drawn travel-poster illustrations (not photos — an
   offline app can't rely on fetching real images every day, and
   these are original art, so there's nothing to license). One is
   picked by day-of-month and repeats monthly, same as a 30-photo
   rotation would. A matching money-mindset line does the same.
   ========================================================= */
const SCENE = (() => {
  // Six times-of-day. Each place borrows one.
  const SKY = [
    { top: '#F6CDB0', bot: '#EE8F63', ink: '#5A2E1C', star: false }, // dawn
    { top: '#AEE1F2', bot: '#E8F7FB', ink: '#2C4A61', star: false }, // morning
    { top: '#8FCBE8', bot: '#D3EEF6', ink: '#1F3A4D', star: false }, // midday
    { top: '#F8C67A', bot: '#EE7B52', ink: '#4F2615', star: false }, // golden hour
    { top: '#4A3F6B', bot: '#9C5678', ink: '#201830', star: true },  // dusk
    { top: '#121C2E', bot: '#2B3E5C', ink: '#070B14', star: true },  // night
  ];

  // Reusable silhouette families, each drawn in the "ink" colour of its sky.
  const SHAPE = {
    tower: (c, ink) => `<path d="M${c-3} 300 L${c-3} 150 L${c-16} 150 L${c-7} 112 L${c-11} 112 L${c} 46 L${c+11} 112 L${c+7} 112 L${c+16} 150 L${c+3} 150 L${c+3} 300 Z" fill="${ink}"/>`,
    spires: (c, ink) => `${[-34,-10,16,40].map((dx,i)=>`<path d="M${c+dx-5} 300 L${c+dx-5} ${190-i%2*18} L${c+dx} ${120-i%2*18} L${c+dx+5} ${190-i%2*18} L${c+dx+5} 300 Z" fill="${ink}"/>`).join('')}`,
    dome: (c, ink) => `<rect x="${c-46}" y="240" width="92" height="60" fill="${ink}"/><path d="M${c-30} 240 A30 40 0 0 1 ${c+30} 240 Z" fill="${ink}"/><rect x="${c-70}" y="180" width="10" height="120" fill="${ink}"/><path d="M${c-70} 180 a6 10 0 0 1 12 0" fill="${ink}"/><rect x="${c+60}" y="180" width="10" height="120" fill="${ink}"/><path d="M${c+60} 180 a6 10 0 0 1 12 0" fill="${ink}"/>`,
    pagoda: (c, ink) => `${[0,1,2].map(i=>`<path d="M${c-60+i*9} ${260-i*46} L${c+60-i*9} ${260-i*46} L${c+34-i*9} ${232-i*46} L${c-34+i*9} ${232-i*46} Z" fill="${ink}"/>`).join('')}<rect x="${c-5}" y="94" width="10" height="42" fill="${ink}"/>`,
    pyramid: (c, ink) => `<path d="M${c-76} 300 L${c-6} 150 L${c+30} 210 L${c+30} 300 Z" fill="${ink}"/><path d="M${c-30} 300 L${c+54} 170 L${c+120} 300 Z" fill="${ink}" opacity=".88"/>`,
    skyline: (c, ink) => `${[[-130,120,30],[-92,170,26],[-56,130,34],[-14,210,24],[26,150,30],[66,185,26],[102,140,30]].map(([dx,h,w])=>`<rect x="${c+dx}" y="${300-h}" width="${w}" height="${h}" fill="${ink}"/>`).join('')}`,
    opera: (c, ink) => `${[[-100,66],[-58,88],[-10,74],[34,96],[74,70]].map(([dx,h])=>`<path d="M${c+dx} 300 Q${c+dx+6} ${300-h} ${c+dx+22} ${300-h*.82} Q${c+dx+38} ${300-h} ${c+dx+44} 300 Z" fill="${ink}"/>`).join('')}<rect x="${c-108}" y="296" width="226" height="8" fill="${ink}"/>`,
    bridge: (c, ink) => `<rect x="${c-120}" y="150" width="8" height="150" fill="${ink}"/><rect x="${c+112}" y="150" width="8" height="150" fill="${ink}"/><path d="M${c-150} 210 Q${c} 120 ${c+150} 210" stroke="${ink}" stroke-width="6" fill="none"/><rect x="${c-150}" y="255" width="300" height="8" fill="${ink}"/>`,
    statue: (c, ink) => `<rect x="${c-24}" y="250" width="48" height="50" fill="${ink}"/><rect x="${c-6}" y="140" width="12" height="112" fill="${ink}"/><path d="M${c-6} 160 L${c-60} 120 M${c+6} 160 L${c+60} 120" stroke="${ink}" stroke-width="10" stroke-linecap="round"/><circle cx="${c}" cy="122" r="14" fill="${ink}"/>`,
    columns: (c, ink) => `<rect x="${c-110}" y="268" width="220" height="12" fill="${ink}"/>${[-90,-58,-26,6,38,70].map(dx=>`<rect x="${c+dx}" y="190" width="14" height="78" fill="${ink}"/>`).join('')}<path d="M${c-118} 190 L${c} 130 L${c+118} 190 Z" fill="${ink}"/>`,
    mountain: (c, ink) => `<path d="M${c-140} 300 L${c-54} 140 L${c-10} 190 L${c+40} 110 L${c+150} 300 Z" fill="${ink}"/><path d="M${c-54} 140 L${c-40} 162 L${c-68} 162 Z" fill="#fff" opacity=".8"/><path d="M${c+40} 110 L${c+56} 136 L${c+24} 136 Z" fill="#fff" opacity=".8"/>`,
    island: (c, ink) => `<ellipse cx="${c}" cy="298" rx="150" ry="10" fill="${ink}" opacity=".5"/><path d="M${c-60} 300 Q${c-64} 200 ${c-20} 160 Q${c-30} 200 ${c-10} 210 Q${c-6} 170 ${c+6} 150" stroke="${ink}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M${c+70} 300 Q${c+66} 220 ${c+100} 180 Q${c+92} 220 ${c+112} 230" stroke="${ink}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M${c-110} 300 L${c-110} 260 L${c-78} 260 L${c-78} 300 Z" fill="${ink}"/><path d="M${c-94} 260 L${c-110} 236 L${c-78} 236 Z" fill="${ink}"/>`,
    santorini: (c, ink) => `${[-86,-44,-2,40,82].map((dx,i)=>`<rect x="${c+dx}" y="${250-(i%2)*26}" width="38" height="${50+(i%2)*26}" fill="${ink}" rx="4"/><path d="M${c+dx+3} 250 A16 16 0 0 1 ${c+dx+35} 250 Z" fill="#3B6EA5" opacity=".9"/>`).join('')}`,
    wall: (c, ink) => `<path d="M${c-150} 260 L${c-90} 210 L${c-40} 250 L${c+20} 190 L${c+80} 230 L${c+150} 180" stroke="${ink}" stroke-width="16" fill="none"/>${[-90,-40,20,80].map(dx=>`<rect x="${c+dx-10}" y="${dx===-90?196:dx===-40?236:dx===20?176:216}" width="20" height="24" fill="${ink}"/>`).join('')}`,
    rowhouses: (c, ink) => `${[-96,-58,-20,18,56].map((dx,i)=>`<path d="M${c+dx} 300 L${c+dx} ${220-(i%3)*10} L${c+dx+17} ${196-(i%3)*10} L${c+dx+34} ${220-(i%3)*10} L${c+dx+34} 300 Z" fill="${ink}"/>`).join('')}`,
  };

  const PLACES = [
    { name: 'Paris', country: 'France', shape: 'tower', sky: 4 },
    { name: 'Agra', country: 'India', shape: 'dome', sky: 0 },
    { name: 'New York', country: 'USA', shape: 'skyline', sky: 5 },
    { name: 'Kyoto', country: 'Japan', shape: 'pagoda', sky: 1 },
    { name: 'Cairo', country: 'Egypt', shape: 'pyramid', sky: 3 },
    { name: 'Rome', country: 'Italy', shape: 'columns', sky: 3 },
    { name: 'Sydney', country: 'Australia', shape: 'opera', sky: 2 },
    { name: 'San Francisco', country: 'USA', shape: 'bridge', sky: 1 },
    { name: 'Rio de Janeiro', country: 'Brazil', shape: 'statue', sky: 3 },
    { name: 'Athens', country: 'Greece', shape: 'columns', sky: 1 },
    { name: 'Istanbul', country: 'Turkey', shape: 'dome', sky: 4 },
    { name: 'London', country: 'UK', shape: 'tower', sky: 5 },
    { name: 'Venice', country: 'Italy', shape: 'bridge', sky: 0 },
    { name: 'Dubai', country: 'UAE', shape: 'skyline', sky: 5 },
    { name: 'Machu Picchu', country: 'Peru', shape: 'mountain', sky: 0 },
    { name: 'Santorini', country: 'Greece', shape: 'santorini', sky: 2 },
    { name: 'Bali', country: 'Indonesia', shape: 'island', sky: 2 },
    { name: 'Maldives', country: 'Maldives', shape: 'island', sky: 1 },
    { name: 'Reykjavik', country: 'Iceland', shape: 'mountain', sky: 5 },
    { name: 'Cape Town', country: 'South Africa', shape: 'mountain', sky: 3 },
    { name: 'Petra', country: 'Jordan', shape: 'columns', sky: 3 },
    { name: 'Beijing', country: 'China', shape: 'wall', sky: 1 },
    { name: 'Moscow', country: 'Russia', shape: 'dome', sky: 4 },
    { name: 'Barcelona', country: 'Spain', shape: 'spires', sky: 3 },
    { name: 'Amsterdam', country: 'Netherlands', shape: 'rowhouses', sky: 1 },
    { name: 'Prague', country: 'Czechia', shape: 'tower', sky: 5 },
    { name: 'Hong Kong', country: 'China', shape: 'skyline', sky: 4 },
    { name: 'Mexico City', country: 'Mexico', shape: 'pyramid', sky: 2 },
    { name: 'Queenstown', country: 'New Zealand', shape: 'mountain', sky: 1 },
    { name: 'Jaipur', country: 'India', shape: 'dome', sky: 3 },
  ];

  const QUOTES = [
    'A rupee saved today is a choice you made for your future self.',
    'Track it, and money stops feeling like a mystery.',
    'Small, steady savings beat big, rare ones.',
    'Spend on purpose, not on autopilot.',
    'Every column you balance is a habit you\u2019re building.',
    'Budgets aren\u2019t limits — they\u2019re promises to yourself.',
    'The goal isn\u2019t to spend less. It\u2019s to spend on purpose.',
    'What gets written down gets managed.',
    'A little discipline today buys a lot of freedom later.',
    'Savings are just expenses you said no to, on purpose.',
    'Know where it goes, and it stops going nowhere.',
    'Consistency with small amounts beats intensity with big ones.',
    'Your future self is watching today\u2019s choices.',
    'Money managed quietly compounds loudly.',
    'Every entry you log is a decision you own.',
    'Plan the month, don\u2019t just survive it.',
    'A clear balance is a calm mind.',
    'Patience is a financial strategy.',
    'What you track, you can trust.',
    'Good money habits are built one day at a time.',
    'Spend like you\u2019ll want to look back proudly.',
    'Save first, spend what\u2019s left — not the other way round.',
    'Every rupee has a job. Give it one.',
    'The best time to start was earlier. The next best time is today.',
    'Discipline now is comfort later.',
    'Clarity about money is its own kind of wealth.',
    'Small leaks sink big budgets.',
    'You don\u2019t need more income to feel in control — just a clearer picture.',
    'A plan you check daily is a plan that works.',
    'Progress, not perfection — one column at a time.',
  ];

  let current = null;

  function dayIndex(n) {
    const d = new Date();
    return (d.getDate() - 1) % n;
  }

  function sceneSVG(place) {
    const sky = SKY[place.sky];
    const shapeFn = SHAPE[place.shape];
    const stars = sky.star ? [...Array(28)].map(() => `<circle cx="${Math.random()*400}" cy="${(Math.random()*180).toFixed(0)}" r="${(Math.random()*1.2+.3).toFixed(1)}" fill="#fff" opacity="${(Math.random()*.6+.3).toFixed(2)}"/>`).join('') : '';
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${sky.top}"/><stop offset="1" stop-color="${sky.bot}"/>
      </linearGradient></defs>
      <rect width="400" height="300" fill="url(#sky)"/>
      ${stars}
      <ellipse cx="200" cy="300" rx="220" ry="18" fill="${sky.ink}" opacity=".18"/>
      ${shapeFn(200, sky.ink)}
    </svg>`;
  }

  function apply() {
    const place = PLACES[dayIndex(PLACES.length)];
    const quote = QUOTES[dayIndex(QUOTES.length)];
    current = { place, quote };
    const bg = document.getElementById('bg');
    const cap = document.getElementById('bg-caption');
    if (bg) bg.innerHTML = sceneSVG(place);
    if (cap) cap.innerHTML = `<b>${place.name}</b>, ${place.country}`;
    return current;
  }

  return { apply, get current() { return current; } };
})();

/**
 * Register a mini-app. This is the ONLY thing a new mini-app needs to do.
 *   id      short url-safe name          'kaasu'
 *   name    label on the home card       'Kaasu'
 *   icon    emoji on the home card       '💰'
 *   tint    card background colour
 *   stores  database tables it uses      ['kaasu_transactions']
 *   mount   (el, ctx) => void            draws the mini-app into el
 *           (omit it and a "coming soon" screen is shown)
 */
function registerApp(app) { APPS.push(app); }

/* ---------- Local database (IndexedDB, on this phone only) ---------- */
const DB = (() => {
  const NAME = 'anu';
  let db;

  const wrap = (req) => new Promise((ok, fail) => { req.onsuccess = () => ok(req.result); req.onerror = () => fail(req.error); });
  const needed = () => [...new Set(APPS.flatMap((a) => a.stores || []))];

  function open(version) {
    return new Promise((ok, fail) => {
      const req = version ? indexedDB.open(NAME, version) : indexedDB.open(NAME);
      req.onupgradeneeded = () => {
        const d = req.result;
        needed().forEach((s) => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
      };
      req.onsuccess = () => ok(req.result);
      req.onerror = () => fail(req.error);
    });
  }

  // Opens the database and creates any table a mini-app declares that is missing.
  async function init() {
    let d = await open();
    if (needed().some((s) => !d.objectStoreNames.contains(s))) {
      const next = d.version + 1;
      d.close();
      d = await open(next);
    }
    d.onversionchange = () => d.close();
    db = d;
  }

  const store = (name, mode) => db.transaction(name, mode).objectStore(name);

  return {
    init,
    uid: () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)),
    all: (name) => wrap(store(name, 'readonly').getAll()),
    get: (name, id) => wrap(store(name, 'readonly').get(id)),
    put: async (name, obj) => { if (!obj.id) obj.id = DB.uid(); await wrap(store(name, 'readwrite').put(obj)); return obj; },
    del: (name, id) => wrap(store(name, 'readwrite').delete(id)),

    async exportAll() {
      const data = {};
      for (const s of db.objectStoreNames) data[s] = await DB.all(s);
      return { app: 'ANU', version: 1, exportedAt: new Date().toISOString(), data };
    },

    async importAll(payload) {
      if (!payload || payload.app !== 'ANU' || typeof payload.data !== 'object') throw new Error('Not an ANU backup file.');
      const names = [...db.objectStoreNames].filter((s) => Array.isArray(payload.data[s]));
      if (!names.length) throw new Error('This backup has no data to restore.');
      await new Promise((ok, fail) => {
        const tx = db.transaction(names, 'readwrite');
        names.forEach((s) => {
          const st = tx.objectStore(s);
          st.clear();
          payload.data[s].forEach((row) => st.put(row));
        });
        tx.oncomplete = ok;
        tx.onerror = () => fail(tx.error);
        tx.onabort = () => fail(tx.error);
      });
    }
  };
})();

/* ---------- Small UI helpers ---------- */
const UI = {
  toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(UI._t);
    UI._t = setTimeout(() => t.classList.remove('show'), 2600);
  },
  sheet(html) {
    const d = $('#sheet');
    d.innerHTML = `<div class="sheet-in">${html}</div>`;
    if (!d.open) d.showModal();
    return d;
  },
  closeSheet() { const d = $('#sheet'); if (d.open) d.close(); },
  confirm(title, message, okLabel = 'Yes') {
    return new Promise((resolve) => {
      const d = UI.sheet(`<h2>${title}</h2><p>${message}</p>
        <button class="btn" data-ok>${okLabel}</button>
        <button class="btn ghost" data-no>Cancel</button>`);
      let done = false;
      const finish = (v) => { if (done) return; done = true; UI.closeSheet(); resolve(v); };
      $('[data-ok]', d).onclick = () => finish(true);
      $('[data-no]', d).onclick = () => finish(false);
      d.addEventListener('close', () => finish(false), { once: true });
    });
  }
};
// tapping the dimmed area closes the sheet
$('#sheet').addEventListener('click', (e) => { if (e.target === e.currentTarget) UI.closeSheet(); });

/* ---------- Greeting ---------- */
function greetingFor(d = new Date()) {
  const h = d.getHours();
  if (h >= 5 && h < 12) return ['Good morning', '🌷'];
  if (h >= 12 && h < 17) return ['Good afternoon', '🎀'];
  return ['Good evening', '🌙'];
}
function updateGreeting() {
  const el = $('.greeting');
  if (!el) return;
  const [text, emoji] = greetingFor();
  el.innerHTML = `${text}, ${OWNER} <span class="em">${emoji}</span>`;
}

/* ---------- Backup & restore ---------- */
async function saveBackup() {
  const payload = await DB.exportAll();
  const stamp = new Date().toISOString().slice(0, 10);
  const name = `anu-backup-${stamp}.json`;
  const file = new File([JSON.stringify(payload, null, 2)], name, { type: 'application/json' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'ANU backup' });
      UI.toast('Backup saved');
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;   // she closed the share sheet
    }
  }
  const url = URL.createObjectURL(file);
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  UI.toast('Backup saved');
}

async function restoreBackup(file) {
  let payload;
  try { payload = JSON.parse(await file.text()); }
  catch { UI.toast("That file couldn't be read."); return; }
  if (!payload || payload.app !== 'ANU') { UI.toast("That isn't an ANU backup file."); return; }

  const ok = await UI.confirm('Restore this backup?',
    'Everything in ANU on this phone will be replaced by what is in this file. This can\u2019t be undone.', 'Replace my data');
  if (!ok) return;
  try {
    await DB.importAll(payload);
    UI.toast('Backup restored');
    route();
  } catch (err) {
    UI.toast(err.message || "Couldn't restore that backup.");
  }
}

function openBackupSheet() {
  const d = UI.sheet(`
    <h2>Backup & restore</h2>
    <p>Everything you write stays on this phone only. Save a backup file every so often, so you can get your data back if the app is ever deleted or Safari data is cleared.</p>
    <button class="btn" data-save>Save backup</button>
    <label class="btn ghost" for="restore-file">Restore from backup</label>
    <input class="vh" id="restore-file" type="file" accept="application/json,.json">
    <button class="btn ghost" data-close>Close</button>`);
  $('[data-save]', d).onclick = () => { UI.closeSheet(); saveBackup(); };
  $('[data-close]', d).onclick = UI.closeSheet;
  $('#restore-file', d).onchange = (e) => {
    const f = e.target.files && e.target.files[0];
    UI.closeSheet();
    if (f) restoreBackup(f);
  };
}

/* ---------- Screens ---------- */
const root = $('#root');

function renderHome() {
  root.innerHTML = `
    <section class="home screen">
      <h1 class="greeting"></h1>
      <p class="quote">${SCENE.current ? SCENE.current.quote : ''}</p>
      <nav class="grid" aria-label="Mini-apps">
        ${APPS.map((a) => `
          <a class="card" href="#/${a.id}" style="--ico-radius:${a.round ? '50%' : '18px'}">
            <span class="ico" aria-hidden="true">${a.icon}</span>
            <span class="name">${a.name}</span>
          </a>`).join('')}
      </nav>
      <div class="foot"><button class="linkbtn" id="backup-btn">Backup & restore</button></div>
    </section>`;
  updateGreeting();
  $('#backup-btn').onclick = openBackupSheet;
}

function renderApp(app) {
  root.innerHTML = `
    <section class="app screen">
      
      <header class="bar">
        <a class="back" href="#/" aria-label="Back to home">
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
        </a>
        <h1>${app.name}</h1>
      </header>
      <div id="app-body"></div>
    </section>`;
  const body = $('#app-body');
  const ctx = { db: DB, ui: UI, app, go: (p) => { location.hash = '#/' + p; } };
  if (typeof app.mount === 'function') app.mount(body, ctx);
  else body.innerHTML = `<div class="note"><div class="big">${app.icon}</div><p>${app.name} isn\u2019t built yet. It\u2019s coming in a later step.</p></div>`;
}

function route() {
  const id = location.hash.replace(/^#\/?/, '');
  const app = APPS.find((a) => a.id === id);
  if (app) renderApp(app); else renderHome();
  window.scrollTo(0, 0);
}
